# Local development / self-hosted deployment stack.
# Usage: docker compose up -d
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin_panel
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: admin_panel
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_panel"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://admin_panel:changeme@db:5432/admin_panel?schema=public"

volumes:
  db_data:
